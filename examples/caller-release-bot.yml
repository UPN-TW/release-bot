name: Release Bot

# 說明：https://github.com/UPN-TW/release-bot
on:
  pull_request_target:
    types: [closed]
    branches: [dev, master]

permissions:
  contents: read

jobs:
  release-bot:
    if: github.event.pull_request.merged == true
    uses: UPN-TW/release-bot/.github/workflows/release-bot.yml@v1
    secrets:
      app-private-key: ${{ secrets.MAMILOVE_RELEASE_BOT_KEY }}
